<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Askeri Çay Ocağı Sipariş & Stok Takip</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Askeri Çay Ocağı","short_name":"Çay Ocağı","start_url":"./","display":"standalone","background_color":"%23020617","theme_color":"%23059669","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Kayıt Başarılı:', reg.scope))
          .catch(err => console.log('Service Worker Kayıt Hatası:', err));
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc } from 'firebase/firestore';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';

    window.firebaseModules = {
      initializeApp, getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc,
      getAuth, signInAnonymously, onAuthStateChanged
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Coffee = ({ size = 20 }) => <span style={{ fontSize: size }}>☕</span>;
    const ShoppingBag = ({ size = 18 }) => <span style={{ fontSize: size }}>🛍️</span>;
    const CheckCircle = ({ size = 14, className = "" }) => <span style={{ fontSize: size }} className={className}>✅</span>;
    const Clock = ({ size = 20 }) => <span style={{ fontSize: size }}>🕒</span>;
    const Truck = ({ size = 12 }) => <span style={{ fontSize: size }}>🚚</span>;
    const XCircle = ({ size = 12 }) => <span style={{ fontSize: size }}>❌</span>;
    const Lock = ({ size = 16 }) => <span style={{ fontSize: size }}>🔒</span>;
    const Unlock = ({ size = 14 }) => <span style={{ fontSize: size }}>🔓</span>;
    const Plus = ({ size = 16 }) => <span style={{ fontSize: size }}>➕</span>;
    const Trash2 = ({ size = 14 }) => <span style={{ fontSize: size }}>🗑️</span>;
    const Volume2 = ({ size = 16 }) => <span style={{ fontSize: size }}>🔊</span>;
    const VolumeX = ({ size = 16, className = "" }) => <span style={{ fontSize: size }} className={className}>🔇</span>;
    const Bell = ({ size = 16 }) => <span style={{ fontSize: size }}>🔔</span>;
    const ShieldAlert = ({ size = 20 }) => <span style={{ fontSize: size }}>🛡️</span>;
    const ChevronRight = ({ size = 16 }) => <span style={{ fontSize: size }}>❯</span>;
    const Sun = ({ size = 16 }) => <span style={{ fontSize: size }}>☀️</span>;
    const Moon = ({ size = 16 }) => <span style={{ fontSize: size }}>🌙</span>;
    const DollarSign = ({ size = 20 }) => <span style={{ fontSize: size }}>💰</span>;
    const PackageCheck = ({ size = 20 }) => <span style={{ fontSize: size }}>📦</span>;
    const Edit2 = ({ size = 14 }) => <span style={{ fontSize: size }}>✏️</span>;
    const Layers = ({ size = 20 }) => <span style={{ fontSize: size }}>📚</span>;
    const Key = ({ size = 14 }) => <span style={{ fontSize: size }}>🔑</span>;
    const Wifi = ({ size = 16 }) => <span style={{ fontSize: size }}>📶</span>;
    const WifiOff = ({ size = 16, className = "" }) => <span style={{ fontSize: size }} className={className}>⚠️</span>;

    const firebaseConfig = {
      apiKey: "AIzaSyBqUU2I6LLHC1J6Qda_KRgZddsP-xcJ9JE",
      authDomain: "askeri-cay.firebaseapp.com",
      projectId: "askeri-cay",
      storageBucket: "askeri-cay.firebasestorage.app",
      messagingSenderId: "1036713262641",
      appId: "1:1036713262641:web:c04f3fecb4dd5952901f10",
      measurementId: "G-Q44SL231G9"
    };

    const INITIAL_PRODUCTS = [
      { id: '1', name: 'Rize Çayı', category: 'Sıcak İçecekler', price: 5, available: true, icon: '☕' },
      { id: '2', name: 'Oralet (Kuşburnu)', category: 'Sıcak İçecekler', price: 5, available: true, icon: '🍵' },
      { id: '3', name: 'Türk Kahvesi', category: 'Sıcak İçecekler', price: 15, available: true, icon: '☕' },
      { id: '4', name: 'Hazır Kahve (3ü1 arada)', category: 'Sıcak İçecekler', price: 12, available: true, icon: '☕' },
      { id: '5', name: 'Soğuk Çay (Ice Tea)', category: 'Soğuk İçecekler', price: 20, available: true, icon: '🥤' },
      { id: '6', name: 'Kutu Kola / Fanta', category: 'Soğuk İçecekler', price: 25, available: true, icon: '🥤' },
      { id: '7', name: 'Soda / Maden Suyu', category: 'Soğuk İçecekler', price: 10, available: true, icon: '🍾' },
      { id: '8', name: 'Su (500ml)', category: 'Soğuk İçecekler', price: 5, available: true, icon: '💧' },
      { id: '9', name: 'Bisküvi / Gofret', category: 'Atıştırmalık', price: 10, available: true, icon: '🍪' },
      { id: '10', name: 'Karışık Tost', category: 'Atıştırmalık', price: 40, available: true, icon: '🥪' },
      { id: '11', name: 'Kuru Pasta (Tabak)', category: 'Atıştırmalık', price: 30, available: false, icon: '🍰' }
    ];

    const LOCATIONS = [
      'Nöbetçi Subay Odası',
      'Yazı İşleri',
      'Garaj Odası',
      'Santral',
      'Çardak',
      'Bölük Komutanı Odası',
      'Bölük Astsubay Odası',
      'Bölük Koğuşu',
      'Hava Savunma Komutanlığı',
      'Uzman Çavuş Gazinosu',
      'Uzman Erbaş Gazinosu'
    ];

    const RANKS = [
      'Er / Erbaş',
      'Uzman Çavuş',
      'Astsubay',
      'Subay',
      'Sivil Personel'
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('askeri_cay_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [regName, setRegName] = useState('');
      const [regRank, setRegRank] = useState('');

      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('user-order');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPin, setAdminPin] = useState('1923');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [showPinModal, setShowPinModal] = useState(false);

      const [soundEnabled, setSoundEnabled] = useState(true);
      const [darkMode, setDarkMode] = useState(true);
      const [isCloudConnected, setIsCloudConnected] = useState(false);

      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [orders, setOrders] = useState([]);
      const [adminOrderFilter, setAdminOrderFilter] = useState('Tümü');
      const [selectedCategory, setSelectedCategory] = useState('Tümü');

      const [cart, setCart] = useState([]);
      const [location, setLocation] = useState(LOCATIONS[0]);
      const [orderNote, setOrderNote] = useState('');
      const [activeUserOrderId, setActiveUserOrderId] = useState(null);

      const [editingProduct, setEditingProduct] = useState(null);
      const [prodName, setProdName] = useState('');
      const [prodCategory, setProdCategory] = useState('Sıcak İçecekler');
      const [prodPrice, setProdPrice] = useState('');
      const [prodIcon, setProdIcon] = useState('☕');

      const [newPin, setNewPin] = useState('');
      const [pinChangeSuccess, setPinChangeSuccess] = useState(false);

      const previousPendingCountRef = useRef(0);
      const dbRef = useRef(null);
      const appIdRef = useRef('cay-ocagi-askeri-v1');
      
      const isAdminLoggedInRef = useRef(isAdminLoggedIn);
      useEffect(() => {
        isAdminLoggedInRef.current = isAdminLoggedIn;
      }, [isAdminLoggedIn]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('askeri_cay_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('askeri_cay_user');
        }
      }, [currentUser]);

      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.firebaseModules) {
            clearInterval(checkFirebase);
            initFirebaseApp(window.firebaseModules);
          }
        }, 100);
        return () => clearInterval(checkFirebase);
      }, []);

      const initFirebaseApp = async (fb) => {
        try {
          const app = fb.initializeApp(firebaseConfig);
          const authInstance = fb.getAuth(app);
          dbRef.current = fb.getFirestore(app);

          await fb.signInAnonymously(authInstance);
          fb.onAuthStateChanged(authInstance, (usr) => {
            setUser(usr);
          });
        } catch (err) {
          console.error("Firebase Başlatılamadı:", err);
        }
      };

      const requestNotificationPermission = async () => {
        if (!("Notification" in window)) {
          alert("Bu tarayıcı bildirimleri desteklemiyor.");
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          alert("Bildirimler başarıyla aktif edildi!");
        } else {
          alert("Bildirim izni verilmedi.");
        }
      };

      useEffect(() => {
        if (!user || !dbRef.current) return;
        const fb = window.firebaseModules;
        const ordersColRef = fb.collection(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'orders');
        const productsColRef = fb.collection(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products');

        const unsubscribeOrders = fb.onSnapshot(ordersColRef, (snapshot) => {
          setIsCloudConnected(true);
          const ordersList = snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          ordersList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          
          const currentPendingCount = ordersList.filter(o => o.status === 'Bekliyor').length;
          
          if (currentPendingCount > previousPendingCountRef.current && isAdminLoggedInRef.current) {
            if (soundEnabled) {
              playNotificationSound();
            }
            if ("Notification" in window && Notification.permission === "granted") {
              const latestOrder = ordersList.find(o => o.status === 'Bekliyor');
              if (latestOrder) {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.ready.then(registration => {
                    registration.showNotification("☕ Yeni Askeri Çay Siparişi!", {
                      body: `${latestOrder.customerRank} ${latestOrder.customerName}\nKonum: ${latestOrder.location} (${latestOrder.totalAmount} ₺)`,
                      icon: "https://cdn-icons-png.flaticon.com/512/924/924514.png",
                      tag: 'cay-siparis'
                    });
                  });
                } else {
                  new Notification("☕ Yeni Askeri Çay Siparişi!", {
                    body: `${latestOrder.customerRank} ${latestOrder.customerName}\nKonum: ${latestOrder.location} (${latestOrder.totalAmount} ₺)`,
                    icon: "https://cdn-icons-png.flaticon.com/512/924/924514.png"
                  });
                }
              }
            }
          }
          previousPendingCountRef.current = currentPendingCount;
          setOrders(ordersList);
        }, (err) => {
          setIsCloudConnected(false);
        });

        const unsubscribeProducts = fb.onSnapshot(productsColRef, (snapshot) => {
          if (!snapshot.empty) {
            const prodList = snapshot.docs.map(docSnap => ({
              id: docSnap.id,
              ...docSnap.data()
            }));
            setProducts(prodList);
          } else {
            INITIAL_PRODUCTS.forEach(async (p) => {
              await fb.setDoc(fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products', p.id), p);
            });
          }
        }, (err) => {});

        return () => {
          unsubscribeOrders();
          unsubscribeProducts();
        };
      }, [user, soundEnabled]);

      const handleRegister = (e) => {
        e.preventDefault();
        if (!regRank) {
          alert('Lütfen rütbenizi belirtiniz!');
          return;
        }
        if (!regName.trim()) {
          alert('Lütfen isminizi veya devrenizi giriniz.');
          return;
        }
        setCurrentUser({ name: regName.trim(), rank: regRank });
      };

      const playNotificationSound = () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        } catch (e) {}
      };

      const addToCart = (product) => {
        if (!product.available) return;
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const removeFromCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            if (existing.qty > 1) {
              return prev.map(item => item.id === product.id ? { ...item, qty: item.qty - 1 } : item);
            }
            return prev.filter(item => item.id !== product.id);
          }
          return prev;
        });
      };

      const getTotalCartAmount = () => {
        return cart.reduce((total, item) => total + (item.price * item.qty), 0);
      };

      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0 || !currentUser || !dbRef.current) return;

        const fb = window.firebaseModules;
        const orderData = {
          customerName: currentUser.name,
          customerRank: currentUser.rank,
          location,
          note: orderNote.trim(),
          items: cart,
          totalAmount: getTotalCartAmount(),
          status: 'Bekliyor',
          createdAt: Date.now(),
          timestamp: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          date: new Date().toLocaleDateString('tr-TR')
        };

        try {
          const ordersColRef = fb.collection(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'orders');
          const docRef = await fb.addDoc(ordersColRef, orderData);
          setActiveUserOrderId(docRef.id);
          setCart([]);
          setOrderNote('');
          setActiveTab('user-status');
        } catch (err) {
          alert("Sipariş gönderilemedi. Bağlantınızı kontrol edin.");
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (pinInput === adminPin) {
          setIsAdminLoggedIn(true);
          setShowPinModal(false);
          setPinInput('');
          setPinError(false);
          setActiveTab('admin-orders');
        } else {
          setPinError(true);
          setPinInput('');
        }
      };

      const handleUpdateOrderStatus = async (orderId, newStatus) => {
        if (!dbRef.current) return;
        const fb = window.firebaseModules;
        try {
          const orderRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'orders', orderId);
          await fb.updateDoc(orderRef, { status: newStatus });
        } catch (err) {}
      };

      const handleDeleteOrder = async (orderId) => {
        if (!dbRef.current) return;
        const fb = window.firebaseModules;
        try {
          const orderRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'orders', orderId);
          await fb.deleteDoc(orderRef);
        } catch (err) {}
      };

      const handleToggleProductAvailability = async (product) => {
        if (!dbRef.current) return;
        const fb = window.firebaseModules;
        try {
          const prodRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products', product.id);
          await fb.updateDoc(prodRef, { available: !product.available });
        } catch (err) {}
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodName || !prodPrice || !dbRef.current) return;
        const fb = window.firebaseModules;

        if (editingProduct) {
          try {
            const prodRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products', editingProduct.id);
            await fb.updateDoc(prodRef, {
              name: prodName,
              category: prodCategory,
              price: parseFloat(prodPrice),
              icon: prodIcon || '☕'
            });
            resetProductForm();
          } catch (err) {}
        } else {
          const newId = Date.now().toString();
          const newProduct = {
            id: newId,
            name: prodName,
            category: prodCategory,
            price: parseFloat(prodPrice),
            available: true,
            icon: prodIcon || '☕'
          };
          try {
            const prodRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products', newId);
            await fb.setDoc(prodRef, newProduct);
            resetProductForm();
          } catch (err) {}
        }
      };

      const startEditProduct = (prod) => {
        setEditingProduct(prod);
        setProdName(prod.name);
        setProdCategory(prod.category);
        setProdPrice(prod.price.toString());
        setProdIcon(prod.icon || '☕');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const resetProductForm = () => {
        setEditingProduct(null);
        setProdName('');
        setProdPrice('');
        setProdIcon('☕');
        setProdCategory('Sıcak İçecekler');
      };

      const handleDeleteProduct = async (productId) => {
        if (!dbRef.current) return;
        const fb = window.firebaseModules;
        try {
          const prodRef = fb.doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'products', productId);
          await fb.deleteDoc(prodRef);
          if (editingProduct?.id === productId) resetProductForm();
        } catch (err) {}
      };

      const handleChangePin = (e) => {
        e.preventDefault();
        if (newPin.length === 4) {
          setAdminPin(newPin);
          setNewPin('');
          setPinChangeSuccess(true);
          setTimeout(() => setPinChangeSuccess(false), 3000);
        }
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full shadow-2xl space-y-4">
              <div className="text-center space-y-2">
                <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto border border-emerald-500/30">
                  <Coffee size={24} />
                </div>
                <h1 className="font-extrabold text-lg text-slate-100">Askeri Çay Ocağı Girişi</h1>
                <p className="text-xs text-slate-400">Sipariş verebilmek için lütfen bilgilerinizi kaydedin.</p>
              </div>

              <form onSubmit={handleRegister} className="space-y-3">
                <div>
                  <label className="text-xs text-amber-400 font-semibold mb-1 block">Lütfen rütbenizi belirtiniz! *</label>
                  <select 
                    value={regRank} 
                    onChange={(e) => setRegRank(e.target.value)}
                    required
                    className="w-full text-xs rounded-xl p-3 border bg-slate-950 border-slate-800 text-slate-200 outline-none focus:border-emerald-500"
                  >
                    <option value="">-- Rütbe Seçiniz --</option>
                    {RANKS.map((r, i) => (
                      <option key={i} value={r}>{r}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-xs text-slate-400 font-semibold mb-1 block">İsim Soyisim / Devre *</label>
                  <input 
                    type="text" 
                    placeholder="Örn: Ahmet Yılmaz / 2024-1" 
                    value={regName}
                    onChange={(e) => setRegName(e.target.value)}
                    required
                    className="w-full text-xs rounded-xl p-3 border bg-slate-950 border-slate-800 text-slate-200 outline-none focus:border-emerald-500"
                  />
                </div>

                <button 
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition-all mt-2"
                >
                  Sisteme Giriş Yap
                </button>
              </form>
            </div>
          </div>
        );
      }

      const categories = ['Tümü', ...new Set(products.map(p => p.category))];
      const displayedProducts = selectedCategory === 'Tümü' 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      const filteredOrders = orders.filter(o => {
        if (adminOrderFilter === 'Bekleyenler') return o.status === 'Bekliyor' || o.status === 'Hazırlanıyor';
        if (adminOrderFilter === 'Yolda') return o.status === 'Yolda';
        if (adminOrderFilter === 'Tamamlananlar') return o.status === 'Teslim Edildi' || o.status === 'İptal Edildi';
        return true;
      });

      const totalRevenue = orders
        .filter(o => o.status === 'Teslim Edildi')
        .reduce((sum, o) => sum + (o.totalAmount || 0), 0);

      const getStatusBadge = (status) => {
        switch(status) {
          case 'Bekliyor':
            return <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1"><Clock size={12}/> Bekliyor</span>;
          case 'Hazırlanıyor':
            return <span className="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1">🔄 Hazırlanıyor</span>;
          case 'Yolda':

                          className="p-1.5 text-slate-500 hover:text-rose-400 rounded-lg"
                        >
                          <Trash2 size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className={`mt-6 p-4 rounded-2xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <h3 className="font-bold text-xs text-slate-300 uppercase mb-2 flex items-center gap-1">
                    <Key size={14} className="text-emerald-400" /> Admin PIN Şifresi Değiştir
                  </h3>
                  <form onSubmit={handleChangePin} className="flex gap-2">
                    <input 
                      type="password" 
                      maxLength={4} 
                      placeholder="Yeni 4 Haneli PIN" 
                      value={newPin} 
                      onChange={e => setNewPin(e.target.value)}
                      className={`flex-1 text-xs rounded-xl p-2 border ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-300'}`}
                    />
                    <button type="submit" className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-xs px-3 rounded-xl">
                      Güncelle
                    </button>
                  </form>
                  {pinChangeSuccess && (
                    <p className="text-[11px] text-emerald-400 mt-1">PIN Başarıyla Değiştirildi!</p>
                  )}
                </div>

              </div>
            )}

          </main>

          {cart.length > 0 && activeTab === 'user-order' && (
            <div className="fixed bottom-16 left-0 right-0 z-30 px-4">
              <div className={`max-w-md mx-auto p-3.5 rounded-2xl border shadow-2xl backdrop-blur-md ${darkMode ? 'bg-slate-900/95 border-emerald-500/40' : 'bg-white/95 border-emerald-600/40'}`}>
                <form onSubmit={handlePlaceOrder} className="space-y-2.5">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 font-semibold mb-0.5 block">Teslimat Yeri (Konum)</label>
                      <select 
                        value={location} 
                        onChange={(e) => setLocation(e.target.value)}
                        className={`w-full text-xs rounded-xl p-2 border ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-300'}`}
                      >
                        {LOCATIONS.map((loc, idx) => (
                          <option key={idx} value={loc}>{loc}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] text-slate-400 font-semibold mb-0.5 block">Özel Not (İsteğe bağlı)</label>
                      <input 
                        type="text" 
                        placeholder="Örn: Şekerli olsun" 
                        value={orderNote}
                        onChange={(e) => setOrderNote(e.target.value)}
                        className={`w-full text-xs rounded-xl p-2 border ${darkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-300'}`}
                      />
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-1 border-t border-slate-800/60">
                    <div>
                      <span className="text-[10px] text-slate-400 block">Toplam Tutar</span>
                      <span className="text-base font-black text-emerald-400 font-mono">{getTotalCartAmount()} ₺</span>
                    </div>

                    <button 
                      type="submit"
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-6 py-3 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center gap-2 active:scale-95 transition-all"
                    >
                      Siparişi Ver <ChevronRight size={16} />
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <nav className={`fixed bottom-0 left-0 right-0 z-40 border-t ${darkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white border-slate-200'} backdrop-blur-md`}>
            <div className={`max-w-md mx-auto grid ${isAdminLoggedIn ? 'grid-cols-4' : 'grid-cols-2'} gap-1 p-2`}>
              
              <button 
                onClick={() => setActiveTab('user-order')}
                className={`flex flex-col items-center justify-center py-2 rounded-xl transition-all ${
                  activeTab === 'user-order' ? 'bg-emerald-500/10 text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Coffee size={20} />
                <span className="text-[10px] mt-1">Sipariş Ver</span>
              </button>

              <button 
                onClick={() => setActiveTab('user-status')}
                className={`flex flex-col items-center justify-center py-2 rounded-xl transition-all relative ${
                  activeTab === 'user-status' ? 'bg-emerald-500/10 text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Clock size={20} />
                <span className="text-[10px] mt-1">Durum</span>
                {orders.length > 0 && (
                  <span className="absolute top-1 right-5 w-2 h-2 bg-emerald-500 rounded-full"></span>
                )}
              </button>

              {isAdminLoggedIn && (
                <button 
                  onClick={() => setActiveTab('admin-orders')}
                  className={`flex flex-col items-center justify-center py-2 rounded-xl transition-all relative ${
                    activeTab === 'admin-orders' ? 'bg-emerald-500/10 text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <ShieldAlert size={20} />
                  <span className="text-[10px] mt-1">Gelenler</span>
                  {orders.filter(o => o.status === 'Bekliyor').length > 0 && (
                    <span className="absolute top-1.5 right-4 bg-amber-500 text-slate-950 font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center animate-bounce">
                      {orders.filter(o => o.status === 'Bekliyor').length}
                    </span>
                  )}
                </button>
              )}

              {isAdminLoggedIn && (
                <button 
                  onClick={() => setActiveTab('admin-stock')}
                  className={`flex flex-col items-center justify-center py-2 rounded-xl transition-all ${
                    activeTab === 'admin-stock' ? 'bg-emerald-500/10 text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Layers size={20} />
                  <span className="text-[10px] mt-1">Stok & Düzen</span>
                </button>
              )}

            </div>
          </nav>

          {showPinModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-xs w-full shadow-2xl space-y-4">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-emerald-500/30">
                    <Lock size={24} />
                  </div>
                  <h3 className="font-extrabold text-base text-slate-100">Çaycı Girişi</h3>
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <div>
                    <input 
                      type="password" 
                      maxLength={4}
                      placeholder="****" 
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      autoFocus
                      className="w-full text-center tracking-[0.5em] font-mono text-lg p-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:border-emerald-500 outline-none"
                    />
                    {pinError && (
                      <p className="text-[11px] text-rose-400 text-center mt-1">Hatalı PIN Kodu!</p>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button 
                      type="button" 
                      onClick={() => setShowPinModal(false)}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl transition-all"
                    >
                      İptal
                    </button>
                    <button 
                      type="submit" 
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all"
                    >
                      Giriş Yap
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
